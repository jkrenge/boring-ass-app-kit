# Deploys the Worker in api/ to your Cloudflare account on every push to main that touches it.
# It does nothing until you set CLOUDFLARE_ACCOUNT_ID; see "Deploying from GitHub" in the README.
name: Deploy API

on:
  push:
    branches: [main]
    paths: [api/**, .github/workflows/deploy.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.CLOUDFLARE_ACCOUNT_ID != ''
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash # the deploy step relies on bash word splitting
        working-directory: api
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      API_DOMAIN: ${{ vars.API_DOMAIN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22 # wrangler needs 22.12 or later
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - run: uv run pytest

      - name: Serve only from your domain
        # so its WAF rules can't be bypassed through workers.dev; only this checkout changes
        if: env.API_DOMAIN != ''
        run: |
          python3 - <<'EOF'
          import pathlib
          config = pathlib.Path("wrangler.jsonc")
          text = config.read_text()
          assert '  "main":' in text
          config.write_text(text.replace('  "main":', '  "workers_dev": false,\n  "main":', 1))
          EOF

      # Migrations only ever add, so they go first and the running Worker keeps working. On the first run
      # there is no database yet: deploy creates it, and the apply after it sets it up.
      - name: Apply migrations
        run: |
          if uv run pywrangler d1 info boring-api > /dev/null 2>&1; then
            uv run pywrangler d1 migrations apply boring-api --remote
          fi

      - run: uv run pywrangler deploy ${API_DOMAIN:+--domain "$API_DOMAIN"}

      - name: Apply migrations to a new database
        run: uv run pywrangler d1 migrations apply boring-api --remote
